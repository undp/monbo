<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#3A3541">
  <!-- A 30 × 30 m loss pixel, 8 px per metre, its (0, 0) corner at (80, 280).
       The farm lies below its edge, the line from (0, 15) to (30, 5). -->
  <rect width="400" height="330" fill="#FFFFFF"/>
  <!-- The farm, below its edge -->
  <polygon points="32,144 368,256 368,310 32,310" fill="#03689E" fill-opacity="0.08"/>
  <!-- The loss pixel -->
  <rect x="80" y="40" width="240" height="240" fill="#F8D7D5" stroke="#D32F2F" stroke-width="2"/>
  <!-- Its piece inside the farm -->
  <polygon points="80,280 320,280 320,240 80,160" fill="#D32F2F" fill-opacity="0.8"/>
  <!-- The farm's edge -->
  <line x1="32" y1="144" x2="368" y2="256" stroke="#03689E" stroke-width="3"/>
  <!-- The piece's corners -->
  <g fill="#3A3541">
    <circle cx="80" cy="280" r="4"/>
    <circle cx="320" cy="280" r="4"/>
    <circle cx="320" cy="240" r="4"/>
    <circle cx="80" cy="160" r="4"/>
  </g>
  <text x="80" y="302" text-anchor="middle">(0, 0)</text>
  <text x="320" y="302" text-anchor="middle">(30, 0)</text>
  <text x="330" y="236">(30, 5)</text>
  <text x="72" y="188" text-anchor="end">(0, 15)</text>
  <text x="200" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">300 m²</text>
  <!-- The pixel's side -->
  <line x1="80" y1="24" x2="320" y2="24" stroke="#3A3541" stroke-width="1"/>
  <line x1="80" y1="18" x2="80" y2="30" stroke="#3A3541" stroke-width="1"/>
  <line x1="320" y1="18" x2="320" y2="30" stroke="#3A3541" stroke-width="1"/>
  <text x="200" y="18" text-anchor="middle">30 m</text>
  <text x="200" y="105" text-anchor="middle" fill="#B71C1C">900 m²</text>
</svg>
