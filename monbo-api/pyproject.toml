[project]
name = "monbo-api"
version = "1.5.1"
description = "FastAPI application"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "geopandas==1.1.4",
    "rasterio==1.5.1",
    "colorlog==6.12.0",
    "mercantile==1.2.1",
    "pillow==12.3.0",
    "python-dotenv==1.2.3",
    "pycountry==26.2.16",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "black==26.5.1",
    "mypy==2.3.1",
    "memory-profiler==0.61.0",
]

[tool.uv]
# monbo-api is a runnable application, not a distributable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]  # E: pycodestyle, F: pyflakes, I: isort
lint.ignore = ["E501"]  # Let Black handle line length
exclude = ["migrations", "__pycache__"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
