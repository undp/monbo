[project]
name = "monbo-api"
version = "1.5.1"
description = "FastAPI application"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.115.6",
    "shapely==2.0.6",
    "pyproj==3.7.0",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "geopandas==1.0.1",
    "rasterio==1.4.3",
    "colorlog==6.9.0",
    "mercantile==1.2.1",
    "pillow==11.1.0",
    "python-dotenv==1.0.1",
    "pycountry==24.6.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff",
    "black",
    "mypy",
    "memory-profiler",
]

[tool.uv]
# monbo-api is a runnable application, not a distributable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]  # E: pycodestyle, F: pyflakes, I: isort
lint.ignore = ["E501"]  # Let Black handle line length
exclude = ["migrations", "__pycache__"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
