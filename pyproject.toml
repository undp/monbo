[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]  # E: pycodestyle, F: pyflakes, I: isort
lint.ignore = ["E501"]  # Let Black handle line length
exclude = ["migrations", "__pycache__"]
