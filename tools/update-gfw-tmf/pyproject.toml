[project]
name = "update-gfw-tmf"
version = "0.1.0"
description = "Download and process GFW/TMF forest-change data from Google Earth Engine"
requires-python = ">=3.13"
dependencies = [
    "earthengine-api==1.7.45",
    "geemap==0.38.5",
    # The GDAL Python bindings must match the system libgdal they build against,
    # so this is deliberately a range the operator narrows to their own install
    # rather than an exact pin. See README for the version-matching requirement.
    "GDAL>=3.6.0",
    "tenacity==9.1.4",
]

[tool.uv]
# This is a runnable standalone script, not a distributable package.
package = false
