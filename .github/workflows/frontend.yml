name: Frontend CI

on:
  pull_request:
    # Draft PRs do not run CI; marking a PR "ready for review" triggers it.
    types: [opened, synchronize, ready_for_review]

jobs:
  frontend:
    name: Type-check, lint, build
    # Skip while the PR is a draft so drafts don't burn CI minutes.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monbo-front
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be installed before actions/setup-node so its `cache: pnpm`
      # can locate the pnpm store. The pnpm version comes from the
      # `packageManager` field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: monbo-front/pnpm-lock.yaml

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: monbo-front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('monbo-front/pnpm-lock.yaml') }}-${{ hashFiles('monbo-front/src/**/*.[jt]s', 'monbo-front/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('monbo-front/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
