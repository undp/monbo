name: API CI

on:
  pull_request:
    # Draft PRs do not run CI; marking a PR "ready for review" triggers it.
    types: [opened, synchronize, ready_for_review]

jobs:
  api:
    name: Test and static checks
    # Skip while the PR is a draft so drafts don't burn CI minutes.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monbo-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true

      # Fails if pyproject.toml and uv.lock are inconsistent. uv provisions the
      # interpreter declared by .python-version (3.11) automatically.
      - name: Install dependencies
        run: uv sync --frozen

      # Blocking checks. pytest includes the deterministic numpy 2 numeric
      # baseline gate (tests/test_numeric_baseline.py); a failure in any step
      # below fails the job, as the continuous-integration spec requires.
      - name: Test (pytest)
        run: uv run pytest

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type-check (mypy)
        run: uv run mypy app
